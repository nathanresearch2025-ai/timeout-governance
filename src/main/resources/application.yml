server:
  port: 8090

spring:
  application:
    name: dolphinscheduler-timeout-governance
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:timeout_governance}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

timeout-governance:
  alert:
    retry:
      max-attempts: 3
      delay-seconds: 30
    suppression:
      default-window-minutes: 15
  escalation:
    default-wait-minutes: 30
  dolphinscheduler:
    api-url: ${DS_API_URL:http://localhost:12345/dolphinscheduler}
    token: ${DS_API_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
