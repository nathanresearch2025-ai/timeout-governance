server:
  port: 8090

spring:
  application:
    name: dolphinscheduler-timeout-governance
  datasource:
    url: jdbc:h2:mem:timeout_governance;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

timeout-governance:
  alert:
    retry:
      max-attempts: 3
      delay-seconds: 30
    suppression:
      default-window-minutes: 15
  escalation:
    default-wait-minutes: 30
  dolphinscheduler:
    api-url: ${DS_API_URL:http://localhost:12345/dolphinscheduler}
    token: ${DS_API_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
